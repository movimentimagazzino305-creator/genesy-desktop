name: Build Genesy Desktop for Mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Configurazione Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Genesy_Desktop/package.json

      - name: 📦 Installazione Dipendenze
        working-directory: ./Genesy_Desktop
        run: |
          npm install

      - name: 🍎 Compilazione Installer Mac (.dmg e .zip Universal)
        working-directory: ./Genesy_Desktop
        run: |
          npx electron-builder --mac dmg zip --universal -c.directories.output="dist"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Carica Installer come Artefatto scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: Genesy-Desktop-MacOS
          path: |
            Genesy_Desktop/dist/*.dmg
            Genesy_Desktop/dist/*.zip
