name: Build Genesy Desktop for Mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Configurazione Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installazione Dipendenze
        run: |
          if [ -d "Genesy_Desktop" ]; then
            cd Genesy_Desktop
          fi
          npm install

      - name: 🍎 Compilazione Installer Mac (.dmg e .zip Universal)
        run: |
          if [ -d "Genesy_Desktop" ]; then
            cd Genesy_Desktop
          fi
          npx electron-builder --mac dmg zip --universal -c.directories.output="dist"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Carica Installer come Artefatto scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: Genesy-Desktop-MacOS
          path: |
            **/dist/*.dmg
            **/dist/*.zip
