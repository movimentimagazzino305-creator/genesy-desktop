<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Genesy Desktop - Parquet Romagna</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap");

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .splash-card {
            width: 100%;
            height: 100%;
            padding: 55px 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.25) 0%, rgba(11, 15, 25, 0.97) 75%);
            position: relative;
        }

        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 10px;
        }

        .logo-wrapper {
            position: relative;
            width: 125px;
            height: 125px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 4s ease-in-out infinite;
        }

        .logo-img {
            width: 115px;
            height: 115px;
            border-radius: 26px;
            object-fit: cover;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 215, 0, 0.35);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .brand-title {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 1.05rem;
            color: #38bdf8;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            background: rgba(56, 189, 248, 0.12);
            padding: 7px 24px;
            border-radius: 24px;
            border: 1px solid rgba(56, 189, 248, 0.35);
        }

        .progress-section {
            width: 100%;
            margin-bottom: 10px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 1.08rem;
        }

        .status-text {
            color: #cbd5e1;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .status-icon {
            color: #38bdf8;
            font-size: 1.2rem;
        }

        .percentage-badge {
            font-weight: 700;
            color: #38bdf8;
            font-size: 1.15rem;
            font-family: monospace;
            background: rgba(15, 23, 42, 0.7);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .progress-bar-container {
            width: 100%;
            height: 16px;
            background: rgba(30, 41, 59, 0.88);
            border-radius: 16px;
            overflow: hidden;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb 0%, #38bdf8 50%, #22d3ee 100%);
            border-radius: 12px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }

        .progress-bar-fill::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: shimmer 1.8s infinite;
        }

        .footer-note {
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>

    <div class="splash-card">
        <div class="brand-header">
            <div class="logo-wrapper">
                <img src="logo_gold.png" alt="Parquet Romagna Logo" class="logo-img">
            </div>
            <div class="brand-title">Genesy Desktop</div>
            <div class="brand-subtitle">Parquet Romagna</div>
        </div>

        <div class="progress-section">
            <div class="status-header">
                <div class="status-text" id="statusText">
                    <i class="fa-solid fa-circle-notch fa-spin status-icon"></i>
                    <span>Inizializzazione del sistema Parquet Romagna...</span>
                </div>
                <div class="percentage-badge" id="percentBadge">0%</div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="footer-note">
            Piattaforma aziendale per la gestione di preventivi, cantieri e contratti Parquet
        </div>
    </div>

    <script>
        const phases = [
            { pct: 20, text: "Inizializzazione del sistema Parquet Romagna...", icon: "fa-bolt" },
            { pct: 45, text: "Caricamento cataloghi prodotti e connessione Cloud...", icon: "fa-cloud-arrow-up" },
            { pct: 70, text: "Sincronizzazione archivio clienti e preventivi...", icon: "fa-file-invoice-dollar" },
            { pct: 90, text: "Preparazione interfaccia e strumenti CRM...", icon: "fa-sliders" },
            { pct: 100, text: "Configurazione completata! Avvio in corso...", icon: "fa-circle-check" }
        ];

        let currentPhase = 0;

        function updateProgress() {
            if (currentPhase >= phases.length) return;

            const p = phases[currentPhase];
            document.getElementById("progressFill").style.width = p.pct + "%";
            document.getElementById("percentBadge").textContent = p.pct + "%";
            
            const statusEl = document.getElementById("statusText");
            statusEl.innerHTML = `<i class="fa-solid ${p.icon} status-icon"></i> <span>${p.text}</span>`;

            currentPhase++;

            if (currentPhase < phases.length) {
                // 4 intervalli intermedi x 950ms = 3800ms
                setTimeout(updateProgress, 950);
            } else {
                // Completamento finale: 200ms iniziale + 3800ms fasi + 1000ms finale = 5000ms (5 secondi esatti)
                setTimeout(() => {
                    try {
                        const { ipcRenderer } = require("electron");
                        ipcRenderer.send("splash-complete");
                    } catch (e) {
                        console.log("Splash terminato (modalita non-Electron)");
                    }
                }, 1000);
            }
        }

        // Avvio prima fase dopo 200ms
        setTimeout(updateProgress, 200);
    </script>
</body>
</html>
